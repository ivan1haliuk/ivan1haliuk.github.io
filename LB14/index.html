<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЛР 14 — Каталог пральних машин</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body data-translation="javascript">
    <p id="startup-status" role="status">Завантаження перекладів / Loading translations...</p>
    <div class="modal" id="language-modal" hidden>
        <section class="modal-window" role="dialog" aria-modal="true" aria-labelledby="language-title">
            <h2 id="language-title">Оберіть мову / Choose a language</h2>
            <form id="language-form">
                <label for="initial-language">Мова каталогу / Catalog language</label>
                <select id="initial-language">
                    <option value="uk">Українська</option>
                    <option value="en">English</option>
                </select>
                <button class="btn btn-yellow" id="language-submit" type="submit" disabled>Підтвердити / Confirm</button>
            </form>
            <p class="form-error" id="language-error" role="alert"></p>
        </section>
    </div>
    <div id="site-content" hidden>
    <header class="page-header">
        <a class="site-name" href="index.html" data-i18n="siteName">ПРАЛЬНІ МАШИНИ</a>
        <div class="language-control">
            <label for="language-selector" data-i18n="languageLabel">Мова:</label>
            <select id="language-selector" disabled>
                <option value="uk">Українська</option>
                <option value="en">English</option>
            </select>
        </div>
        <a class="cart-link" href="basket.html" id="cart-link" aria-label="Корзина, кількість найменувань: 0">
            <svg class="cart-icon" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M3 5h4l4 16h14l4-11H9"></path>
                <circle cx="13" cy="27" r="2"></circle>
                <circle cx="24" cy="27" r="2"></circle>
            </svg>
            <span data-i18n="cart">Корзина</span>
            <span class="cart-count" id="cart-count" aria-live="polite">0</span>
        </a>
    </header>

    <main class="page-content">
        <h1 class="main-title" id="catalog-title"></h1>
        <p id="catalog-status" role="status" aria-live="polite" data-i18n="loading">Завантаження товарів...</p>
        <button class="btn btn-outline" id="catalog-retry" type="button" hidden data-i18n="retry">Повторити завантаження</button>

        <div class="catalog-container" id="product-container" hidden></div>
        <p class="storage-warning" id="storage-warning" role="alert" hidden></p>
    </main>

    <div class="modal" id="modal" hidden>
        <section class="modal-window" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-text">
            <button class="modal-close" id="modal-close" type="button" aria-label="Закрити вікно" data-i18n-label="close">&times;</button>
            <h2 id="modal-title" data-i18n="quantityTitle">Вкажіть кількість:</h2>
            <p id="modal-text"></p>
            <form id="quantity-form" novalidate>
                <label for="quantity" data-i18n="quantityLabel">Кількість, шт.</label>
                <input id="quantity" name="quantity" type="number" min="1" max="999" step="1" value="1" required aria-describedby="quantity-error">
                <p class="form-error" id="quantity-error" role="alert"></p>
                <button class="btn btn-yellow" id="quantity-submit" type="submit" data-i18n="addSubmit">Додати до корзини</button>
            </form>
            <div class="modal-actions" id="message-actions" hidden>
                <a class="btn btn-yellow" id="modal-cart-link" href="basket.html" data-i18n="goCart">Перейти у корзину</a>
                <button class="btn btn-outline" id="modal-continue" type="button" data-i18n="backShopping">Повернутись до покупок</button>
            </div>
        </section>
    </div>
    <noscript><p class="noscript-warning">Для роботи корзини увімкніть JavaScript у браузері.</p></noscript>
    </div>
</body>
</html>
