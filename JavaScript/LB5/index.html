<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота 7</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <div class="box">
        <h3>Завдання 1: Температура</h3>
        <label>Фаренгейт: <input type="number" id="f-inp"></label><br><br>
        <label>Цельсій: <input type="number" id="c-inp"></label>
    </div>
    <div class="box">
        <h3>Завдання 2: Множення (ввід)</h3>
        <p id="t2-score">Загальний рахунок 0% (0 з 0)</p>
        <button id="t2-next">Наступне завдання</button><br><br>
        <span id="t2-task"></span>
        <input type="number" id="t2-ans" style="width: 60px;">
        <button id="t2-chk">Перевірити</button>
        <p id="t2-res"></p>
    </div>
    <div class="box">
        <h3>Завдання 3: Множення (радіокнопки)</h3>
        <p id="t3-score">Загальний рахунок 0% (0 з 0)</p>
        <button id="t3-next">Наступне завдання</button><br><br>
        <span id="t3-task"></span><br>
        <div id="t3-radios"></div>
        <p id="t3-res"></p>
    </div>
    <div class="box">
        <h3>Завдання 4: Галерея (Коти)</h3>
        <div id="rotator"></div>
    </div>
    <div class="box">
        <h3>Завдання 5: Капча</h3>
        <div id="captcha-wrap"></div>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
