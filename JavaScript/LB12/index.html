<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Каталог фотопроєктів — Supabase</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main class="container">
    <h1>Каталог фотопроєктів</h1>
    <p>Портретні, подієві та комерційні фотопроєкти. Навчальний каталог.</p>
    <p id="status" role="status" aria-live="polite">Підключення до бази даних...</p>

    <section aria-labelledby="filters-heading">
      <h2 id="filters-heading">Пошук, фільтрація та сортування</h2>
      <form id="filter-form">
        <label for="search">Пошук за назвою проєкту</label>
        <input id="search" name="search" type="search" maxlength="150">

        <label for="category-filter">Напрям зйомки</label>
        <select id="category-filter" name="category-filter">
          <option value="">Усі напрями</option>
          <option value="Портретна зйомка">Портретна зйомка</option>
          <option value="Зйомка подій">Зйомка подій</option>
          <option value="Комерційна зйомка">Комерційна зйомка</option>
        </select>

        <label for="sort">Сортування</label>
        <select id="sort" name="sort">
          <option value="id">За порядком додавання</option>
          <option value="title-asc">За назвою: від А до Я</option>
          <option value="title-desc">За назвою: від Я до А</option>
        </select>
        <button id="filter-button" type="submit" disabled>Показати проєкти</button>
      </form>
    </section>

    <section aria-labelledby="projects-heading">
      <h2 id="projects-heading">Список фотопроєктів</h2>
      <ul id="projects-list"></ul>
    </section>

    <section aria-labelledby="form-heading">
      <h2 id="form-heading">Додати фотопроєкт</h2>
      <form id="project-form">
        <label for="title">Назва проєкту</label>
        <input id="title" name="title" required maxlength="150">

        <label for="client">Замовник / творча команда</label>
        <input id="client" name="client" required maxlength="150">

        <label for="category">Напрям зйомки</label>
        <select id="category" name="category" required>
          <option value="">Оберіть напрям</option>
          <option value="Портретна зйомка">Портретна зйомка</option>
          <option value="Зйомка подій">Зйомка подій</option>
          <option value="Комерційна зйомка">Комерційна зйомка</option>
        </select>
        <button id="submit-button" type="submit" disabled>Додати</button>
      </form>
      <p id="form-status" role="status" aria-live="polite"></p>
    </section>
  </main>
</body>
</html>
