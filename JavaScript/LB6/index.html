<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Generator</title>
    <link rel="stylesheet" href="styles/style.css">
    <script src="js/script.js" defer></script>
</head>
<body>
    <main class="generator">
        <h1>CSS Generator</h1>

        <div class="tabs" id="tabs">
            <button class="tab active" type="button" data-tab="radius">Border Radius</button>
            <button class="tab" type="button" data-tab="color">Color</button>
            <button class="tab" type="button" data-tab="font-weight">Font Weight</button>
        </div>

        <div class="tab-content active" data-content="radius">
            <h2>Border Radius</h2>

            <div class="control">
                <label for="top-left">Top Left</label>
                <input id="top-left" type="range" min="0" max="100" value="0">
                <span id="top-left-value">0 px</span>
            </div>

            <div class="control">
                <label for="top-right">Top Right</label>
                <input id="top-right" type="range" min="0" max="100" value="0">
                <span id="top-right-value">0 px</span>
            </div>

            <div class="control">
                <label for="bottom-right">Bottom Right</label>
                <input id="bottom-right" type="range" min="0" max="100" value="0">
                <span id="bottom-right-value">0 px</span>
            </div>

            <div class="control">
                <label for="bottom-left">Bottom Left</label>
                <input id="bottom-left" type="range" min="0" max="100" value="0">
                <span id="bottom-left-value">0 px</span>
            </div>
        </div>

        <div class="tab-content" data-content="color">
            <h2>Color</h2>

            <div class="control" id="property-2-controls">
                <label for="text-color">Колір тексту</label>
                <input id="text-color" type="color" value="#000000">
            </div>
        </div>

        <div class="tab-content" data-content="font-weight">
            <h2>Font Weight</h2>

            <div class="control" id="property-3-controls">
                <label for="text-weight">Товщина шрифту</label>

                <select id="text-weight">
                    <option value="normal">normal</option>
                    <option value="bold">bold</option>
                    <option value="100">100</option>
                    <option value="300">300</option>
                    <option value="500">500</option>
                    <option value="700">700</option>
                    <option value="900">900</option>
                </select>
            </div>
        </div>

        <section class="preview-section">
            <h2>Preview</h2>

            <div id="preview" class="preview">
                <span>Preview</span>
                <button id="preview-button" type="button">Click</button>
            </div>

            <p id="coordinates">X: 0; Y: 0</p>
        </section>

        <section class="result">
            <h2>CSS Code</h2>

            <textarea id="css-code" rows="6" readonly></textarea>

            <button id="copy-button" type="button">
                Скопіювати CSS
            </button>

            <p id="copy-message"></p>
        </section>

        <form id="preset-form">
            <h2>Збереження пресета</h2>

            <label for="preset-name">Назва пресета</label>
            <input id="preset-name" type="text">

            <span id="preset-error"></span>

            <button type="submit">
                Зберегти
            </button>
        </form>
    </main>

    <button
        id="scroll-top"
        type="button"
        aria-label="Повернутися вгору"
    >
        ↑
    </button>
</body>
</html>
