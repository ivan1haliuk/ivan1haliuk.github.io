<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicWorld Haliuk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-container">
            <h1>MusicWorld Haliuk</h1>
            <nav>
                <ul>
                    <li><a href="#">Artists</a></li>
                    <li><a href="#">Albums</a></li>
                    <li><a href="#">Concerts</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="albums-section">
            <h2 class="main-title">Recommended albums</h2>
            <h3 class="section-title">For you</h3>
            
            <div class="cards-grid">
                <div class="card">
                    <img src="https://upload.wikimedia.org/wikipedia/uk/d/df/RedHotChiliPeppersCalifornication.jpg" alt="Californication">
                    <div class="card-info">
                        <h4>Californication</h4>
                        <p>Red Hot Chili Peppers</p>
                    </div>
                </div>
                
                <div class="card">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/92/ACDC_Back_in_Black.png/1280px-ACDC_Back_in_Black.png" alt="Back in Black">
                    <div class="card-info">
                        <h4>Back in Black</h4>
                        <p>AC/DC</p>
                    </div>
                </div>
                
                <div class="card">
                    <img src="https://upload.wikimedia.org/wikipedia/uk/d/d3/Dark_Side_Pink_Floyd.jpg" alt="The Dark Side of the Moon">
                    <div class="card-info">
                        <h4>The Dark Side of the Moon</h4>
                        <p>Pink Floyd</p>
                    </div>
                </div>
                
                <div class="card">
                    <img src="https://upload.wikimedia.org/wikipedia/uk/e/e0/Metallica_-_Master_of_Puppets.jpg" alt="Master of Puppets">
                    <div class="card-info">
                        <h4>Master of Puppets</h4>
                        <p>Metallica</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-container">
            <p>© 2024 MusicWorld Haliuk Ivan PI-23-02. All rights reserved.</p>
            <a href="#">Terms of use</a>
        </div>
    </footer>
</body>
</html>
